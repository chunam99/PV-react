<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PV vòng cuối — Culture fit · Working style</title>
    <style>
      :root {
        --bg: #f4efe6;
        --paper: #fffdf8;
        --ink: #1c1915;
        --muted: #5c564c;
        --line: #ddd4c4;
        --def: #1e4d3a;
        --cons: #8a4b12;
        --ex: #1e3d73;
        --accent: #1e3d73;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        font: 16px/1.5 "tahoma";
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
      }
      header {
        max-width: 880px;
        margin: 0 auto;
        padding: 28px 20px 8px;
      }
      h1 {
        font-size: 1.65rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 8px;
      }
      .rule {
        font-size: 0.95rem;
        color: var(--muted);
        margin: 0;
      }
      .rule strong {
        color: var(--ink);
        font-weight: 700;
      }
      nav {
        max-width: 880px;
        margin: 0 auto;
        padding: 16px 20px 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      nav input,
      nav select {
        font: inherit;
        padding: 8px 10px;
        border: 1px solid var(--line);
        background: var(--paper);
        color: var(--ink);
        border-radius: 2px;
      }
      nav input {
        flex: 1;
        min-width: 180px;
      }
      button {
        font:
          13px/1.2 ui-sans-serif,
          system-ui,
          sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        border: 1px solid var(--ink);
        background: transparent;
        color: var(--ink);
        padding: 8px 12px;
        cursor: pointer;
        border-radius: 2px;
      }
      button:hover {
        background: var(--ink);
        color: var(--paper);
      }
      button.primary {
        background: var(--ink);
        color: var(--paper);
      }
      button.primary:hover {
        background: var(--accent);
        border-color: var(--accent);
      }
      button.ghost {
        border-color: var(--line);
        color: var(--muted);
      }
      button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--paper);
      }
      .stats {
        max-width: 880px;
        margin: 12px auto 0;
        padding: 0 20px;
        font: 13px/1.4 "tahoma";
        color: var(--muted);
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 16px 20px 80px;
      }
      .card {
        background: var(--paper);
        border: 1px solid var(--line);
        padding: 28px 28px 22px;
      }
      .meta {
        font:
          12px/1.3 ui-sans-serif,
          system-ui,
          sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .card h2 {
        font-size: 1.45rem;
        line-height: 1.3;
        margin: 0 0 20px;
        font-weight: 700;
      }
      .beat {
        border-left: 3px solid currentColor;
        padding: 10px 0 10px 14px;
        margin: 0 0 12px;
      }
      .beat .label {
        font:
          11px/1 ui-sans-serif,
          system-ui,
          sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin: 0 0 6px;
        font-weight: 700;
      }
      .beat p {
        margin: 0;
      }
      .beat.def {
        color: var(--def);
      }
      .beat.cons {
        color: var(--cons);
      }
      .beat.ex {
        color: var(--ex);
      }
      .beat.def p,
      .beat.cons p,
      .beat.ex p {
        color: var(--ink);
      }
      .hint {
        color: var(--muted);
        font-style: italic;
        margin: 8px 0 0;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      details {
        background: var(--paper);
        border: 1px solid var(--line);
        padding: 12px 16px;
      }
      details summary {
        cursor: pointer;
        font-weight: 700;
        list-style: none;
      }
      details summary::-webkit-details-marker {
        display: none;
      }
      details .beats {
        margin-top: 12px;
      }
      .cat-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .chip {
        font:
          11px/1 ui-sans-serif,
          system-ui,
          sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border: 1px solid var(--line);
        background: var(--paper);
        color: var(--muted);
        padding: 7px 10px;
        cursor: pointer;
        border-radius: 2px;
      }
      .chip[aria-pressed="true"] {
        border-color: var(--ink);
        color: var(--ink);
        background: #ebe4d6;
      }
      @media (max-width: 640px) {
        .card {
          padding: 20px 16px 16px;
        }
        .card h2 {
          font-size: 1.22rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Vòng cuối — Culture fit & Working style</h1>
      <p class="rule">
        Không deep technical. Head hỏi
        <strong>giải pháp · con người · teamwork · định hướng</strong>. Mỗi câu:
        lập trường → cách làm → ví dụ thật của bạn. Không đọc thuộc.
      </p>
    </header>

    <nav>
      <select id="cat"></select>
      <input id="q" type="search" placeholder="Tìm câu hỏi…" />
      <button type="button" id="mode-card" class="primary">Thẻ</button>
      <button type="button" id="mode-list" class="ghost">Danh sách</button>
    </nav>
    <div
      class="cat-row"
      id="chips"
      style="max-width: 880px; margin: 8px auto 0; padding: 0 20px"
    ></div>
    <p class="stats" id="stats"></p>

    <main id="main"></main>

    <script>

          q: "Bạn ưu tiên công việc thế nào khi nhiều deadline?",

        {

          cat: "Working style",

          cons: "Chỉ chat dài không quyết = chậm. Chỉ họp không ghi chú = mất context.",
          ex: "Trước sync design: gửi 3 câu hỏi + screenshot. Sau họp: comment quyết định lên ticket.",

        {
          id: "s3",

          ex: "Comment Figma + Slack: 'Mobile chưa có — em stack 1 cột, confirm trước merge.'",
        },
        {
          id: "s4",
          cat: "Giải pháp",
          q: "Bug production bạn xử lý ra sao?",

          q: "Định hướng 1–2 năm tới?",
          def: "Sâu FE chất lượng (UI system, perf, a11y) + đủ fullstack để tự ship feature. Ownership product surface.",
          cons: "Mơ hồ 'đi lên senior'. Hoặc nhảy quản lý ngay khi role cần IC mạnh.",
          ex: "1 năm: lead FE cho marketing sites + 1 tool nội bộ end-to-end. 2 năm: mentorship + chuẩn design system chung.",
        },
        {
          id: "d2",
          cat: "Định hướng",
          q: "Vì sao FE focus, không thuần BE?",
          def: "Thích impact nhìn thấy (brand, UX). Vẫn tôn trọng/học Go đủ để cộng tác và support API nhỏ.",
          cons: "Nói ghét backend. Role vẫn cần Go preferred — thể hiện sẵn sàng học khi cần.",
          ex: "Em enjoy pixel + interaction. Khi cần endpoint: đọc/contract với BE, có thể viết handler đơn giản.",
        },
        {
          id: "d3",
          cat: "Định hướng",
          q: "Bạn kỳ vọng gì ở leader / team?",
          def: "Rõ ưu tiên, feedback thẳng, không blame culture, có không gian thử trong guardrail.",
          cons: "Danh sách đòi hỏi dài. Zero kỳ vọng = thiếu tự nhận thức.",
          ex: "Kỳ vọng sync ưu tiên tuần. Em mang lại: delivery đúng hẹn + escalate sớm + quality UI.",
        },
        {
          id: "d4",
          cat: "Định hướng",
          q: "Câu hỏi bạn nên hỏi head?",
          def: "Hỏi để hiểu success 90 ngày, cách team FE–design–Marketing chạy, thách thức hiện tại.",
          cons: "Chỉ hỏi lương/WFH đầu tiên. Không hỏi gì.",
          ex: "90 ngày đầu success trông thế nào? Pain lớn nhất của careers/marketing site hiện tại? Team đo chất lượng FE ra sao?",
        },
        {
          id: "x1",
          cat: "Tình huống head",
          q: "Nếu Marketing muốn ship nhanh nhưng thiếu a11y/perf?",
          def: "Giải thích rủi ro user + brand (cybersecurity company). Đề xuất floor tối thiểu + phase 2.",
          cons: "Cứng 'không ship'. Hoặc bỏ hết quality.",
          ex: "Floor: contrast, label, LCP hero. Motion/extra section sau. Ghi ticket phase 2.",
        },
        {
          id: "x2",
          cat: "Tình huống head",
          q: "Bạn vào team đang nợ kỹ thuật / code rối?",
          def: "Không rewrite big-bang. Boy scout: cải thiện chỗ đang đụng. Đề xuất chu kỳ trả nợ nhỏ có ROI.",
          cons: "Phàn nàn code cũ. Rewrite 3 tháng không ship.",
          ex: "Làm feature trên module X → tách component + test chỗ chạm. Đề xuất 20% sprint trả nợ list ưu tiên.",
        },
        {
          id: "x3",
          cat: "Tình huống head",
          q: "Stakeholder đổi yêu cầu giữa chừng?",
          def: "Xác nhận thay đổi scope → impact timeline → chọn: cắt gì / dời deadline / thêm người.",
          cons: "Âm thầm nhận thêm. Phản ứng tiêu cực với stakeholder.",
          ex: "Thêm section mới giữa sprint: đề xuất cắt animation hoặc +2 ngày — họ chọn cắt animation.",
        },
        {
          id: "x4",
          cat: "Tình huống head",
          q: "Bạn đóng góp culture team thế nào?",
          def: "Psychological safety: hỏi được, review tử tế, celebrate ship nhỏ, blameless khi incident.",
          cons: "Chỉ nói 'em hòa đồng'. Không có hành vi cụ thể.",
          ex: "PR review ghi 'đề xuất' không 'sai rồi'. Demo friday 5 phút. Onboarding checklist cho member mới.",
        },
        {
          id: "x5",
          cat: "Tình huống head",
          q: "Success 90 ngày đầu của bạn trông thế nào?",
          def: "Hiểu codebase + stakeholder → ship vài page/tool nhỏ tin cậy → góp 1 cải tiến quy trình/UI.",
          cons: "Hứa rewrite lớn. Không có milestone.",
          ex: "Tuần 1–2: shadow + fix bug nhỏ. Tháng 1: ownership 1 landing. Tháng 2–3: 1 flow tool nội bộ + note handoff.",
        },
      ];

      const CATS = ["Tất cả", ...[...new Set(ITEMS.map((i) => i.cat))]];
      const knownKey = "pv-final-culture";
      const known = new Set(JSON.parse(localStorage.getItem(knownKey) || "[]"));

      const state = {
        cat: "Tất cả",
        q: "",
        mode: "card",
        idx: 0,
        show: false,
      };

      const $ = (id) => document.getElementById(id);

      function saveKnown() {
        localStorage.setItem(knownKey, JSON.stringify([...known]));
      }

      function filtered() {
        const s = state.q.trim().toLowerCase();
        return ITEMS.filter((i) => {
          if (state.cat !== "Tất cả" && i.cat !== state.cat) return false;
          if (!s) return true;
          return (i.q + i.def + i.cons + i.ex).toLowerCase().includes(s);
        });
      }

      function beats(item) {
        return `
        <div class="beat def"><p class="label">Lập trường</p><p>${item.def}</p></div>
        <div class="beat cons"><p class="label">Cách làm / tránh</p><p>${item.cons}</p></div>
        <div class="beat ex"><p class="label">Ví dụ nói</p><p>${item.ex}</p></div>`;
      }

      function render() {
        const list = filtered();
        $("stats").textContent =
          `${list.length} câu · thuộc ${[...known].filter((id) => ITEMS.some((i) => i.id === id)).length}/${ITEMS.length} · Space lật · ← → · K thuộc`;

        if (state.mode === "list") {
          $("main").innerHTML = `<div class="list">${list
            .map(
              (item) => `
          <details>
            <summary>${item.q}${known.has(item.id) ? " · thuộc" : ""}</summary>
            <div class="beats">${beats(item)}</div>
          </details>`,
            )
            .join("")}</div>`;
          return;
        }

        if (!list.length) {
          $("main").innerHTML =
            `<article class="card"><p class="hint">Không có câu nào khớp bộ lọc.</p></article>`;
          return;
        }

        const idx = ((state.idx % list.length) + list.length) % list.length;
        state.idx = idx;
        const item = list[idx];
        $("main").innerHTML = `
        <article class="card">
          <div class="meta">
            <span>${idx + 1} / ${list.length} · ${item.cat}</span>
            <span>${known.has(item.id) ? "đã thuộc" : ""}</span>
          </div>
          <h2>${item.q}</h2>
          ${
            state.show
              ? beats(item)
              : `<p class="hint">Nói bằng chuyện thật của bạn. Thẻ chỉ là khung — thay ví dụ [dự án] bằng case của mình.</p>`
          }
          <div class="actions">
            <button type="button" class="primary" id="flip">${state.show ? "Ẩn" : "Lật đáp án"}</button>
            <button type="button" id="prev">Trước</button>
            <button type="button" id="next">Sau</button>
            <button type="button" id="know">${known.has(item.id) ? "Bỏ thuộc" : "Đã thuộc"}</button>
          </div>
        </article>`;

        $("flip").onclick = () => {
          state.show = !state.show;
          render();
        };
        $("prev").onclick = () => {
          state.idx -= 1;
          state.show = false;
          render();
        };
        $("next").onclick = () => {
          state.idx += 1;
          state.show = false;
          render();
        };
        $("know").onclick = () => {
          if (known.has(item.id)) known.delete(item.id);
          else known.add(item.id);
          saveKnown();
          render();
        };
      }

      $("cat").innerHTML = CATS.map((c) => `<option>${c}</option>`).join("");
      $("chips").innerHTML = CATS.map(
        (c) =>
          `<button type="button" class="chip" data-cat="${c}" aria-pressed="${c === "Tất cả"}">${c}</button>`,
      ).join("");

      $("cat").onchange = (e) => {
        state.cat = e.target.value;
        state.idx = 0;
        state.show = false;
        syncChips();
        render();
      };
      $("q").oninput = (e) => {
        state.q = e.target.value;
        state.idx = 0;
        state.show = false;
        render();
      };
      $("mode-card").onclick = () => {
        state.mode = "card";
        $("mode-card").className = "primary";
        $("mode-list").className = "ghost";
        render();
      };
      $("mode-list").onclick = () => {
        state.mode = "list";
        $("mode-list").className = "primary";
        $("mode-card").className = "ghost";
        render();
      };
      $("chips").onclick = (e) => {
        const btn = e.target.closest("[data-cat]");
        if (!btn) return;
        state.cat = btn.dataset.cat;
        $("cat").value = state.cat;
        state.idx = 0;
        state.show = false;
        syncChips();
        render();
      };

      function syncChips() {
        $("chips")
          .querySelectorAll("[data-cat]")
          .forEach((el) => {
            el.setAttribute(
              "aria-pressed",
              String(el.dataset.cat === state.cat),
            );
          });
      }

      document.addEventListener("keydown", (e) => {
        if (state.mode !== "card") return;
        if (e.target.matches("input, select, textarea")) return;
        if (e.code === "Space") {
          e.preventDefault();
          state.show = !state.show;
          render();
        }
        if (e.key === "ArrowRight") {
          state.idx += 1;
          state.show = false;
          render();
        }
        if (e.key === "ArrowLeft") {
          state.idx -= 1;
          state.show = false;
          render();
        }
        if (e.key === "k" || e.key === "K") {
          const list = filtered();
          if (!list.length) return;
          const item =
            list[((state.idx % list.length) + list.length) % list.length];
          if (known.has(item.id)) known.delete(item.id);
          else known.add(item.id);
          saveKnown();
          render();
        }
      });

      render();
    </script>
  </body>
</html>
