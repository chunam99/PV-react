    <style>
      :root {
        --bg: #f4efe6;
        --paper: #fffdf8;
        --ink: #1c1915;
        --muted: #5c564c;
        --line: #ddd4c4;
        --def: #1e4d3a;
        --cons: #8a4b12;
        --ex: #1e3d73;
        --accent: #1e3d73;
        --known: #1e4d3a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        font:
          16px/1.5 "tahoma",
          serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
      }
      header {
        max-width: 880px;
        margin: 0 auto;
        padding: 28px 20px 8px;
      }
      h1 {
        font-size: 1.65rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 8px;
      }
      .rule {
        font-size: 0.95rem;
        color: var(--muted);
        margin: 0;
      }
      .rule strong {
        color: var(--ink);
        font-weight: 700;
      }
      nav {
        max-width: 880px;
        margin: 0 auto;
        padding: 16px 20px 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      nav input,
      nav select {
        font: inherit;
        padding: 8px 10px;
        border: 1px solid var(--line);
        background: var(--paper);
        color: var(--ink);
        border-radius: 2px;
      }
      nav input {
        flex: 1;
        min-width: 180px;
      }
      button {
        font:
          13px/1.2 ui-sans-serif,
          system-ui,
          sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        border: 1px solid var(--ink);
        background: transparent;
        color: var(--ink);
        padding: 8px 12px;
        cursor: pointer;
        border-radius: 2px;
      }
      button:hover {
        background: var(--ink);
        color: var(--paper);
      }
      button.primary {
        background: var(--ink);
        color: var(--paper);
      }
      button.primary:hover {
        background: var(--accent);
        border-color: var(--accent);
      }
      button.ghost {
        border-color: var(--line);
        color: var(--muted);
      }
      button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--paper);
      }
      .stats {
        max-width: 880px;
        margin: 12px auto 0;
        padding: 0 20px;
        font: 13px/1.4 "tahoma";
        color: var(--muted);
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 16px 20px 80px;
      }
      .card {
        background: var(--paper);
        border: 1px solid var(--line);
        padding: 28px 28px 22px;
      }
      .meta {
        font:
          12px/1.3 ui-sans-serif,
          system-ui,
          sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .card h2 {
        font-size: 1.45rem;
        line-height: 1.3;
        margin: 0 0 20px;
        font-weight: 700;
      }
      .beat {
        border-left: 3px solid currentColor;
        padding: 10px 0 10px 14px;
        margin: 0 0 12px;
      }
      .beat .label {
        font:
          11px/1 ui-sans-serif,
          system-ui,
          sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin: 0 0 6px;
        font-weight: 700;
      }
      .beat p {
        margin: 0;
      }
      .beat.def {
        color: var(--def);
      }
      .beat.cons {
        color: var(--cons);
      }
      .beat.ex {
        color: var(--ex);
      }
      .beat.def p,
      .beat.cons p,
      .beat.ex p {
        color: var(--ink);
      }
      .hint {
        color: var(--muted);
        font-style: italic;
        margin: 8px 0 0;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      details {
        background: var(--paper);
        border: 1px solid var(--line);
        padding: 12px 16px;
      }
      details summary {
        cursor: pointer;
        font-weight: 700;
        list-style: none;
      }
      details summary::-webkit-details-marker {
        display: none;
      }
      details .beats {
        margin-top: 12px;
      }
      .cat-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .chip {
        font:
          11px/1 ui-sans-serif,
          system-ui,
          sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border: 1px solid var(--line);
        background: var(--paper);
        color: var(--muted);
        padding: 7px 10px;
        cursor: pointer;
        border-radius: 2px;
      }
      .chip[aria-pressed="true"] {
        border-color: var(--ink);
        color: var(--ink);
        background: #ebe4d6;
      }
      kbd {
        font:
          11px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        border: 1px solid var(--line);
        padding: 1px 5px;
        border-radius: 2px;
        color: var(--muted);
      }
      @media (max-width: 640px) {
        .card {
          padding: 20px 16px 16px;
        }
        .card h2 {
          font-size: 1.22rem;
        }
      }
      @media print {
        nav,
        .actions,
        .stats {
          display: none;
        }
        .card {
          break-inside: avoid;
        }
      }
    </style>

          ex: "{status:'ok', data} vs {status:'error', error} — switch status thì data chắc chắn có.",

        {

          cons: "Giảm initial load. Split quá mảnh thì waterfall request.",

        },
        {

          q: "Server Component vs Client Component?",
          def: "Server Component render ở server, không gửi JS component đó. Client cần 'use client' khi có state, effect, event, browser API.",
          cons: "Đánh 'use client' cả trang marketing thì mất lợi thế 0KB, LCP/INP xấu.",

        {
          id: "p6",

          q: "Revalidate cache Next.js?",
          def: "ISR theo thời gian (revalidate: 60). On-demand: revalidatePath / revalidateTag qua webhook.",
          cons: "Chỉ ISR thì nội dung mới chờ hết TTL. Chỉ on-demand thì quên webhook là cache cũ mãi.",

          def: "preload: tài nguyên trang hiện tại. prefetch: trang kế. preconnect: bắt tay origin thứ ba.",
          cons: "preload lung tung tranh bandwidth với LCP.",
          ex: "preload hero. prefetch /jobs. preconnect fonts.googleapis.com.",
        },
        {
          id: "p8",
          extra: true,
          cat: "Perf & Next.js",
          q: "Hydration mismatch vì sao?",
          def: "HTML server khác HTML client lần đầu — Date.now, random, window không guard.",
          cons: "React vứt tree, attach lại, nháy UI, warning hydrate.",
          ex: "new Date().getHours() lúc render. Đưa vào useEffect sau mount, hoặc render giờ UTC cố định.",
        },
        {
          id: "p9",
          extra: true,
          cat: "Perf & Next.js",
          q: "next/image giúp LCP thế nào?",
          def: "Resize, format hiện đại, lazy mặc định. Hero cần priority và sizes đúng breakpoint.",
          cons: "Sai sizes thì tải ảnh quá lớn — LCP xấu dù đã dùng Image.",
          ex: "Hero: priority, sizes='100vw' mobile và '~50vw' desktop nếu nửa màn.",
        },
        {
          id: "ai2",
          cat: "Resilience",
          q: "Stream response Agent trên React?",
          def: "SSE hoặc WebSocket nhận chunk, append vào state.",
          cons: "Unmount không abort thì setState trên component chết. Buffer quá lớn thì jank.",
          ex: "fetch stream → decoder → setText(t => t + chunk). AbortController lúc unmount.",
        },
        {
          id: "e1",
          cat: "Resilience",
          q: "Tránh trắng màn hình khi child crash?",
          def: "Error Boundary bắt lỗi render trong subtree, hiện fallback.",
          cons: "Không bắt lỗi event/async — những đó cần try/catch và error state.",
          ex: "Mỗi widget dashboard một boundary: một chart throw, 9 widget kia vẫn sống.",
        },
        {
          id: "e2",
          extra: true,
          cat: "Resilience",
          q: "Loading, empty, error UI?",
          def: "Mọi màn data có ba trạng thái đó, cộng success.",
          cons: "Thiếu empty thì 'trắng'. Thiếu error thì user nghĩ không có data. Skeleton sai size gây CLS.",
          ex: "Jobs: skeleton đúng chiều card. Empty: 'Chưa có job, thử filter khác'. Error: Retry.",
        },
        {
          id: "sit1",
          cat: "Tình huống",
          q: "Trang lag khi gõ search?",
          def: "Mỗi phím vừa filter nặng vừa bắn API.",
          cons: "INP xấu, race request, list dài block main thread.",
          ex: "Debounce 300ms, abort cũ, query key theo q, virtualize 10k row.",
        },
        {
          id: "sit2",
          cat: "Tình huống",
          q: "Chống double submit / double pay?",
          def: "UI khóa nút lúc pending; server bắt trùng bằng idempotency key.",
          cons: "Chỉ disable FE thì double-click mạng chậm vẫn hai request. Không tin mỗi UI.",
          ex: "isPending disable Apply. POST kèm Idempotency-Key. Backend trả cùng payment id.",
        },
        {
          id: "sit3",
          cat: "Tình huống",
          q: "Dashboard 10 widget độc lập?",
          def: "Mỗi widget một query, skeleton, error boundary riêng.",
          cons: "Một fetch chung fail là cả trang chết. Waterfall tuần tự thì chậm.",
          ex: "10 useQuery song song, staleTime khác nhau — widget giá realtime, widget tin ISR.",
        },
        {
          id: "sit4",
          cat: "Tình huống",
          q: "Refactor component 500 dòng?",
          def: "Tách theo trách nhiệm: fetch, UI, hook business. Có test trước.",
          cons: "Rewrite big-bang dễ mất edge case. Public props đổi thì caller vỡ.",
          ex: "useJobList + JobTable + JobFilters. RTL: filter rồi thấy row.",
        },
        {
          id: "sit5",
          extra: true,
          cat: "Tình huống",
          q: "Form nội bộ nhiều field?",
          def: "react-hook-form + schema (zod). Mặc định uncontrolled để ít re-render.",
          cons: "Controlled cả form thì mỗi phím render 50 field.",
          ex: "Apply form: RHF, zod email/phone, disable Submit khi invalid hoặc isPending.",
        },
        {
          id: "sit9",
          extra: true,
          cat: "Tình huống",
          q: "Portal dùng khi nào?",
          def: "Render UI ra node ngoài parent, thường document.body, vẫn giữ React tree.",
          cons: "Modal trong overflow:hidden bị cắt; z-index thua stacking context cha.",
          ex: "createPortal(dialog, document.body) cho Apply modal trên careers site.",
        },
        {
          id: "sit12",
          extra: true,
          cat: "Tình huống",
          q: "Test FE nên viết mức nào?",
          def: "RTL theo việc user làm được. Unit cho hook/pure. E2E ít, flow tới hạn.",
          cons: "Snapshot UI giòn. Test implementation detail thì refactor là đỏ hết.",
          ex: "Gõ search, thấy job title. E2E: điền Apply, submit, thấy success.",
        },
      ];

      const CATS = ["Tất cả", ...[...new Set(ITEMS.map((i) => i.cat))]];
      const knownKey = "pv-react-known";
      const known = new Set(JSON.parse(localStorage.getItem(knownKey) || "[]"));

      const state = {
        cat: "Tất cả",
        q: "",
        extra: false,
        mode: "card",
        idx: 0,
        show: false,
      };

      const $ = (id) => document.getElementById(id);

      function saveKnown() {
        localStorage.setItem(knownKey, JSON.stringify([...known]));
      }

      function filtered() {
        const s = state.q.trim().toLowerCase();
        return ITEMS.filter((i) => {
          if (state.cat !== "Tất cả" && i.cat !== state.cat) return false;
          if (state.extra && !i.extra) return false;
          if (!s) return true;
          return (i.q + i.def + i.cons + i.ex).toLowerCase().includes(s);
        });
      }

      function beats(item) {
        return `
        <div class="beat def"><p class="label">Định nghĩa</p><p>${item.def}</p></div>
        <div class="beat cons"><p class="label">Hệ quả</p><p>${item.cons}</p></div>
        <div class="beat ex"><p class="label">Ví dụ</p><p>${item.ex}</p></div>`;
      }

      function render() {
        const list = filtered();
        $("stats").textContent =
          `${list.length} câu · thuộc ${[...known].filter((id) => ITEMS.some((i) => i.id === id)).length}/${ITEMS.length} · Thẻ: Space lật · ← → chuyển · K đánh dấu thuộc`;

        if (state.mode === "list") {
          $("main").innerHTML = `<div class="list">${list
            .map(
              (item) => `
          <details>
            <summary>${item.q}${item.extra ? " · extra" : ""}${known.has(item.id) ? " · thuộc" : ""}</summary>
            <div class="beats">${beats(item)}</div>
          </details>`,
            )
            .join("")}</div>`;
          return;
        }

        if (!list.length) {
          $("main").innerHTML =
            `<article class="card"><p class="hint">Không có câu nào khớp bộ lọc.</p></article>`;
          return;
        }

        const idx = ((state.idx % list.length) + list.length) % list.length;
        state.idx = idx;
        const item = list[idx];
        $("main").innerHTML = `
        <article class="card">
          <div class="meta">
            <span>${idx + 1} / ${list.length} · ${item.cat}${item.extra ? " · extra JD" : ""}</span>
            <span>${known.has(item.id) ? "đã thuộc" : ""}</span>
          </div>
          <h2>${item.q}</h2>
          ${state.show ? beats(item) : `<p class="hint">Nói 3 nhịp trong đầu, rồi bấm Lật đáp án. Đừng nhìn trước.</p>`}
          <div class="actions">
            <button type="button" class="primary" id="flip">${state.show ? "Ẩn" : "Lật đáp án"}</button>
            <button type="button" id="prev">Trước</button>
            <button type="button" id="next">Sau</button>
            <button type="button" id="know">${known.has(item.id) ? "Bỏ thuộc" : "Đã thuộc"}</button>
          </div>
        </article>`;

        $("flip").onclick = () => {
          state.show = !state.show;
          render();
        };
        $("prev").onclick = () => {
          state.idx -= 1;
          state.show = false;
          render();
        };
        $("next").onclick = () => {
          state.idx += 1;
          state.show = false;
          render();
        };
        $("know").onclick = () => {
          if (known.has(item.id)) known.delete(item.id);
          else known.add(item.id);
          saveKnown();
          render();
        };
      }

      $("cat").innerHTML = CATS.map((c) => `<option>${c}</option>`).join("");
      $("chips").innerHTML = CATS.map(
        (c) =>
          `<button type="button" class="chip" data-cat="${c}" aria-pressed="${c === "Tất cả"}">${c}</button>`,
      ).join("");

      $("cat").onchange = (e) => {
        state.cat = e.target.value;
        state.idx = 0;
        state.show = false;
        syncChips();
        render();
      };
      $("q").oninput = (e) => {
        state.q = e.target.value;
        state.idx = 0;
        state.show = false;
        render();
      };
      $("extra").onclick = () => {
        state.extra = !state.extra;
        $("extra").setAttribute("aria-pressed", String(state.extra));
        state.idx = 0;
        state.show = false;
        render();
      };
      $("mode-card").onclick = () => {
        state.mode = "card";
        $("mode-card").className = "primary";
        $("mode-list").className = "ghost";
        render();
      };
      $("mode-list").onclick = () => {
        state.mode = "list";
        $("mode-list").className = "primary";
        $("mode-card").className = "ghost";
        render();
      };
      $("chips").onclick = (e) => {
        const btn = e.target.closest("[data-cat]");
        if (!btn) return;
        state.cat = btn.dataset.cat;
        $("cat").value = state.cat;
        state.idx = 0;
        state.show = false;
        syncChips();
        render();
      };

      function syncChips() {
        $("chips")
          .querySelectorAll("[data-cat]")
          .forEach((el) => {
            el.setAttribute(
              "aria-pressed",
              String(el.dataset.cat === state.cat),
            );
          });
      }

      document.addEventListener("keydown", (e) => {
        if (state.mode !== "card") return;
        if (e.target.matches("input, select, textarea")) return;
        if (e.code === "Space") {
          e.preventDefault();
          state.show = !state.show;
          render();
        }
        if (e.key === "ArrowRight") {
          state.idx += 1;
          state.show = false;
          render();
        }
        if (e.key === "ArrowLeft") {
          state.idx -= 1;
          state.show = false;
          render();
        }
        if (e.key === "k" || e.key === "K") {
          const list = filtered();
          if (!list.length) return;
          const item =
            list[((state.idx % list.length) + list.length) % list.length];
          if (known.has(item.id)) known.delete(item.id);
          else known.add(item.id);
          saveKnown();
          render();
        }
      });

      render();
    </script>
  </body>
